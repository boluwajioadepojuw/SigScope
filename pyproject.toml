[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SigScope"
version = "0.6.0"
description = "Map your Sigma detection rules onto the MITRE ATT&CK matrix and find coverage gaps."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Boluwaji Oluwaseyi Adepoju" }]
keywords = ["mitre", "att-ck", "sigma", "detection-engineering", "soc", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/boluwajioadepojuw/SigScope"
Repository = "https://github.com/boluwajioadepojuw/SigScope"
Issues = "https://github.com/boluwajioadepojuw/SigScope/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py39"

[project.scripts]
sig-scope = "coverage_gate.cli:main"

[tool.setuptools.packages.find]
include = ["coverage_gate*"]

