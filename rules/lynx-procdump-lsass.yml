title: Procdump Reading LSASS Memory
id: f0bb1809-8717-4bd3-8eb3-b87bfd2f80fe
status: experimental
description: Detects procdump being pointed at lsass.exe, the standard credential-dumping move.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Boluwaji Oluwaseyi Adepoju
date: 2026/06/10
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\procdump.exe'
        CommandLine|contains: 'lsass'
    condition: selection
falsepositives:
    - Legitimate debugging sessions by approved engineers
level: high
